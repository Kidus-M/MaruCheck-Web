name: Beta deployment smoke

on:
  workflow_dispatch:
    inputs:
      beta_url:
        description: HTTPS origin of the beta deployment
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Verify deployed beta
        env:
          BETA_URL: ${{ inputs.beta_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run beta:smoke
